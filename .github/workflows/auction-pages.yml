name: Auction share pages

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "auction/**"
      - "scripts/generate-auction-pages.mjs"
      - ".github/workflows/auction-pages.yml"

permissions:
  contents: write

concurrency:
  group: auction-share-pages
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install image tools
        run: npm install --prefix "$RUNNER_TEMP/seo" sharp
      - name: Generate public property pages
        env:
          SHARP_REQUIRE_FROM: ${{ runner.temp }}/seo/package.json
        run: node scripts/generate-auction-pages.mjs
      - name: Commit generated pages when they change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- auction/index.html auction/p auction/sitemap.xml auction/og-default.jpg auction/favicon.png favicon.ico robots.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update auction share pages"
            git push
          fi
