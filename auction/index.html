  function normalizePhone(input) {
    const digits = String(input || "").replace(/\D/g, "");
    let p = digits;
    if (p.startsWith("92") && p.length === 12) p = "0" + p.slice(2);
    return /^03\d{9}$/.test(p) ? p : null;
  }

  }
  function formatPKR(n) {
    const s = String(Math.round(Number(n) || 0));
    if (s.length <= 3) return "PKR " + s;
    const last3 = s.slice(-3);
    let rest = s.slice(0, -3);
    const parts = [];
    while (rest.length > 2) { parts.unshift(rest.slice(-2)); rest = rest.slice(0, -2); }
    if (rest) parts.unshift(rest);
    return "PKR " + parts.join(",") + "," + last3;
  }
  function toMillis(value) {
    if (!value) return 0;
    if (typeof value.toMillis === "function") return value.toMillis();
    if (typeof value.seconds === "number") return value.seconds * 1000;
    const n = Number(value);
    return Number.isFinite(n) ? n : 0;
  }
  function formatDate(ts) {

    if (!ms) return "";

  function escapeHtml(s) {

  }
  function remainingParts(end) {
    let ms = toMillis(end) - Date.now();
    const ended = ms <= 0;
    if (ms < 0) ms = 0;
    const sec = Math.floor(ms / 1000) % 60;
    const min = Math.floor(ms / 60000) % 60;
    const hr = Math.floor(ms / 3600000) % 24;
    const day = Math.floor(ms / 86400000);
    const pad = n => String(n).padStart(2, "0");

  function statusBadge(prop) {
    const map = { live: ["live","Live"], soon: ["soon","Ending soon"], ended: ["ended","Ended"], closed: ["closed","Closed"] };
    const [cls, text] = map[statusOf(prop)];

  }
  function parseYouTubeId(input) {
    const raw = String(input || "").trim();
    if (!raw) return { id: null };
    if (/^[a-zA-Z0-9_-]{11}$/.test(raw)) return { id: raw };
    let urlStr = raw;
    if (!/^https?:\/\//i.test(urlStr)) urlStr = "https://" + urlStr;
    let u;
    try { u = new URL(urlStr); } catch (e) { return { error: "Only YouTube links are allowed." }; }
    const host = u.hostname.replace(/^www\./i, "").toLowerCase();

  function compressImage(file, maxBytes, maxW) {
    maxBytes = maxBytes || CONFIG.maxPhotoBytes;
    maxW = maxW || 900;
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.width * scale));
        c.height = Math.max(1, Math.round(img.height * scale));
        const g = c.getContext("2d");
        let q = 0.8, out = "";
        const tryQ = () => {
          g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
          g.drawImage(img, 0, 0, c.width, c.height);
          out = c.toDataURL("image/jpeg", q);
          if (dataUrlBytes(out) > maxBytes && q > 0.4) { q -= 0.1; tryQ(); return; }
          if (dataUrlBytes(out) > maxBytes && c.width > 400) {
            c.width = Math.round(c.width * 0.8);
            c.height = Math.round(c.height * 0.8);
            q = 0.7;
            tryQ();
            return;
          }
          URL.revokeObjectURL(url);
          if (dataUrlBytes(out) > maxBytes) reject(new Error("That photo is still too large. Please pick a smaller image."));
          else resolve(out);
        };
        tryQ();
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Could not read that image.")); };
      img.src = url;
    });
  }

  async function placeBid({ propertyId, amount, offer }) {
    const user = auth.currentUser;
    if (!user) throw new Error("Please sign in to place a bid.");
    if (!App.profile || !App.profile.phone) throw new Error("Please add your mobile number first.");
    const value = Number(amount);
    if (!Number.isFinite(value) || value <= 0) throw new Error("Enter a valid bid amount.");
    const off = normalizeOffer(offer);
    if (off.error) throw new Error(off.error);
    const bidCol = collection(db, "properties", propertyId, "bids");
    const bidRef = doc(bidCol);
    const privRef = doc(db, "properties", propertyId, "bidPrivate", bidRef.id);
    const pref = doc(db, "properties", propertyId);
    try {
      await runTransaction(db, async (tx) => {
        const psnap = await tx.get(pref);
        if (!psnap.exists()) throw new Error("Property not found.");
        const p = psnap.data();
        if (p.status === "closed") throw new Error("This auction is closed.");
        if (Date.now() >= toMillis(p.endsAt)) throw new Error("This auction has ended.");
        const need = currentHighestOf(p) + Number(p.increment || 0);
        if (value < need) {
          const err = new Error("LOW_BID");
          err.code = "LOW_BID";
          err.minNext = need;
          throw err;
        }
        tx.set(bidRef, {
          uid: user.uid,
          amount: value,
          offer: off.offer,
          maskedPhone: maskPhone(App.profile.phone),
          createdAt: serverTimestamp()
        });
        tx.set(privRef, {
          uid: user.uid,
          name: App.profile.name || user.displayName || "",
          phone: App.profile.phone,
          createdAt: serverTimestamp()
        });
        tx.update(pref, { currentHighest: value, highestBidId: bidRef.id });
      });
    } catch (err) {
      if (err && err.code === "LOW_BID") throw err;
      if (err && err.code === "permission-denied") throw new Error("This bid could not be placed. Check the amount and that the auction is still open.");
      throw err;
    }
    return true;
  }

  function bindGallery() {

        const i = Math.round(track.scrollLeft / Math.max(track.clientWidth, 1));
        dots.forEach((d, n) => d.classList.toggle("on", n === i));
      }, { passive: true });
    }
  }

  function htmlForRoute() {
    const r = route();
    if (r.name === "auth-wait") return '<div class="card"><div class="empty">Loading…</div></div>';
    if (r.name === "property") return renderProperty(r.id);
    if (r.name === "login") return renderLogin();
    if (r.name === "admin") return renderAdminHome();
    if (r.name === "admin-form") return renderAdminForm(r.id);
    if (r.name === "admin-bids") return renderAdminBids(r.id);
    return renderHome();

  function listenDetailTracked(id) {
    stopDetail();
    App.detail = { prop: null, photos: [], bids: [], privateMap: {}, id: id };
    const push = (u) => { detailUnsubs.push(u); };
    push(onSnapshot(doc(db, "properties", id), (snap) => {
      App.detail.prop = snap.exists() ? Object.assign({ id: snap.id }, snap.data()) : null;
      App.detail.tried = true;
      render();
    }, () => { App.detail.prop = null; App.detail.tried = true; render(); }));
    push(onSnapshot(collection(db, "properties", id, "photos"), (snap) => {
      const rows = snap.docs.map(d => Object.assign({ id: d.id }, d.data()))
        .sort((a, b) => String(a.id).localeCompare(String(b.id), undefined, { numeric: true }));
      App.detail.photos = rows.map(r => r.dataUrl).filter(Boolean);
      if (rows[0] && rows[0].dataUrl) App.covers[id] = rows[0].dataUrl;
      if (route().name === "admin-form" && App.photosEditId === id && !document.activeElement) {
        /* don't clobber in-progress photo edits */
      }
      render();
    }));
    push(onSnapshot(collection(db, "properties", id, "bids"), (snap) => {
      App.detail.bids = snap.docs.map(d => Object.assign({ id: d.id }, d.data()))
        .sort((a, b) => Number(b.amount || 0) - Number(a.amount || 0));
      render();
    }));
    if (isAdminUser(App.user)) {
      push(onSnapshot(collection(db, "properties", id, "bidPrivate"), (snap) => {
        const map = {};
        snap.docs.forEach(d => { map[d.id] = d.data(); });
        App.detail.privateMap = map;
        if (route().name === "admin-bids") render();
      }));
    }
  }

  function ensureRouteData() {
    const r = route();
    const needDetail = (r.name === "property" || r.name === "admin-bids" || (r.name === "admin-form" && r.id)) && r.id;
    if (needDetail) {
      if (App.detail.id !== r.id) listenDetailTracked(r.id);
    } else {
      stopDetail();
      App.detail = { prop: null, photos: [], bids: [], privateMap: {} };
    }
  }

  function onHash() {
    App.bidFlash = null;
    const r = route();
    if (r.name !== "admin-form") { App.photos = []; App.photosEditId = null; }
    ensureRouteData();
    render({ force: true });
  }

  document.addEventListener("click", async (e) => {
    const nav = e.target.closest("[data-nav]");
    if (nav) {
      const key = nav.getAttribute("data-nav");
      go(key === "home" ? "#/" : "#/login");
      return;
    }
    const goBtn = e.target.closest("[data-go]");
    if (goBtn) { go(goBtn.getAttribute("data-go")); return; }
    const signin = e.target.closest("[data-signin]");
    if (signin) {
      try {
        const r = route();
        if (r.name === "property") App.returnTo = location.hash;
        await signInGoogle();
      } catch (err) { toast(err.message || "Could not sign in."); }
      return;
    }
    const signout = e.target.closest("[data-signout]");
    if (signout) { await signOutUser(); toast("Signed out."); render({ force: true }); return; }
    const copy = e.target.closest("[data-copy-link]");
    if (copy) {
      const raw = copy.getAttribute("data-copy-link") || "";
      const id = raw && raw !== "1" ? decodeURIComponent(raw) : "";
      const share = id ? propertyShareUrl(id) : location.href;
      try { await navigator.clipboard.writeText(share); toast("Link copied."); }
      catch (err) { toast(share); }
      return;
    }
    const del = e.target.closest("[data-delete]");
    if (del) {
      if (!confirm("Delete this property and all of its bids? This cannot be undone.")) return;
      try { await deleteProperty(del.getAttribute("data-delete")); toast("Property deleted."); go(adminPath()); }
      catch (err) { toast(err.message || "Could not delete."); }
      return;
    }
    const closeBtn = e.target.closest("[data-close]");
    if (closeBtn) {
      const id = closeBtn.getAttribute("data-close");
      const chosen = document.querySelector('input[name="winner"]:checked');
      try {
        await closeAuction(id, chosen ? chosen.value : null);
        toast("Auction closed.");
        render({ force: true });
      } catch (err) { toast(err.message || "Could not close auction."); }
      return;
    }
    const rem = e.target.closest("[data-remove-photo]");
    if (rem) {
      App.photos.splice(Number(rem.getAttribute("data-remove-photo")), 1);
      const wrap = document.getElementById("thumbs-wrap");
      if (wrap) wrap.innerHTML = thumbsHTML(App.photos);
      return;
    }
  });

  document.addEventListener("change", async (e) => {
    if (e.target && e.target.id === "f-photos") {
      const files = Array.from(e.target.files || []);
      e.target.value = "";
      for (const f of files) {
        if (App.photos.length >= CONFIG.maxPhotos) { toast("You can add up to 4 photos."); break; }
        try {
          const data = await compressImage(f);
          App.photos.push(data);
        } catch (err) { toast(err.message || "Could not add that photo."); }
      }
      const wrap = document.getElementById("thumbs-wrap");
      if (wrap) wrap.innerHTML = thumbsHTML(App.photos);
    }
  });

  document.addEventListener("submit", async (e) => {
    const form = e.target.closest("form[data-form]");
    if (!form) return;
    e.preventDefault();
    const kind = form.getAttribute("data-form");
    try {
      if (kind === "profile") {
        const fd = new FormData(form);
        await saveProfile({ name: fd.get("name"), phone: fd.get("phone") });
        toast("Number saved.");
        if (App.returnTo) { const h = App.returnTo; App.returnTo = null; go(h); }
        else render({ force: true });
        return;
      }
      if (kind === "bid") {
        const fd = new FormData(form);
        const id = form.getAttribute("data-id");
        const offerKeep = { type: fd.get("offType"), city: fd.get("offCity"), size: fd.get("offSize"), description: fd.get("offDesc"), estimatedValue: fd.get("offVal") };
        try {
          await placeBid({
            propertyId: id,
            amount: fd.get("amount"),
            offer: { type: fd.get("offType"), city: fd.get("offCity"), size: fd.get("offSize"), desc: fd.get("offDesc"), estValue: fd.get("offVal") }
          });
          App.bidFlash = { ok: "Bid placed. You are the current highest bidder." };
          toast("Bid placed successfully.");
          render({ force: true });
        } catch (err) {
          App.bidFlash = {
            error: err && err.code === "LOW_BID"
              ? "Bid too low. Enter at least " + formatPKR(err.minNext) + " (current highest + minimum increment)."
              : (err.message || "This bid could not be placed."),
            keep: Object.assign({ amount: fd.get("amount") }, offerKeep)
          };
          render({ force: true });
        }
        return;
      }
      if (kind === "property") {
        const fd = new FormData(form);
        const ms = fromLocalInput(fd.get("auctionEnd"));
        const id = form.getAttribute("data-id") || null;
        try {
          await saveProperty({
            id: id || undefined,
            title: fd.get("title"),
            city: fd.get("city"),
            size: fd.get("size"),
            type: fd.get("type"),
            exchangeWanted: fd.get("exchangeWanted"),
            minBid: fd.get("minBid"),
            increment: fd.get("increment"),
            auctionEnd: ms,
            youtubeUrl: fd.get("youtubeUrl"),
            art: fd.get("art"),
            photos: App.photos.slice()
          });
          toast("Property saved.");
          App.photos = [];
          App.photosEditId = null;
          go(adminPath());
        } catch (err) {
          const box = document.getElementById("form-error");
          if (box) { box.textContent = err.message || "Could not save."; box.classList.remove("hidden"); }
          else toast(err.message || "Could not save.");
        }
        return;
      }
    } catch (err) {
      toast(err.message || "Something went wrong.");
    }
  });

  function bootAuth() {
    getRedirectResult(auth).catch((e) => { if (e && e.code) toast("Sign-in error: " + e.code); });
    onAuthStateChanged(auth, async (user) => {
      App.user = user;
      App.authReady = true;
      try { await loadProfile(user); } catch (e) { /* rules may not be published yet */ }
      ensureRouteData();
      render({ force: true });
    });
  }

  listenProperties();
  window.addEventListener("hashchange", onHash);
  bootAuth();
  ensureRouteData();
  render();
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js", { scope: "/propertyexchange/auction/" }).catch(function () {});
      });
    }
    (function () {
      var deferred = null;
      var button = document.getElementById("install-app");
      if (!button) return;
      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        deferred = event;
        button.hidden = false;
      });
      button.addEventListener("click", function () {
        if (!deferred) return;
        deferred.prompt();
        deferred.userChoice.then(function () {
          deferred = null;
          button.hidden = true;
        });
      });
      window.addEventListener("appinstalled", function () {
        deferred = null;
        button.hidden = true;
      });
    })();
  </script>
</body>
</html>
