<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b2545" />
  <title>Offline | Property Exchange</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b2545; color: #fff; font-family: "Segoe UI", Arial, sans-serif; }
    main { width: min(420px, calc(100% - 32px)); text-align: center; }
    .mark { width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 18px; background: #f4c430; color: #0b2545; display: grid; place-items: center; font-weight: 800; }
    a { display: inline-block; margin-top: 16px; background: #f4c430; color: #0b2545; font-weight: 700; text-decoration: none; padding: 12px 16px; border-radius: 12px; }
    p { color: #c9d4e2; }
  </style>
</head>
<body>
  <main>
    <div class="mark">TWC</div>
    <h1>You are offline</h1>
    <p>Property Exchange needs a connection to load live auctions and sign-in. Reconnect, then try again.</p>
    <a href="/propertyexchange/auction/">Try again</a>
  </main>
</body>
</html>
